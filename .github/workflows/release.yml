name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "gradle/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same cached key as android.yml, so a release build installs over a debug build and the
      # other way round. Rotating the key means changing the cache key in both workflows.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: .keystore/debug.keystore
          key: android-debug-keystore-v2

      - name: Create the signing key when the cache is cold
        run: |
          mkdir -p .keystore
          if [ ! -f .keystore/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore .keystore/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "MT_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/.keystore/debug.keystore" >> "$GITHUB_ENV"

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report the signing certificate
        run: |
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -4
          fi

      - name: Collect the APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: manhwa-translate-release
          path: out/*.apk

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
